name: Vincent CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository
        shell: bash
        run: |
          set -o pipefail
          log_file="vincent-ci-$(date -u +%Y%m%d-%H%M%S).log"
          set +e
          sh scripts/validate.sh 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          printf 'VALIDATION_STATUS=%s\nLOG_FILE=%s\n' "$status" "$log_file"
          exit "$status"
      - name: Upload failed validation evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vincent-ci-failed-${{ github.sha }}
          path: vincent-ci-*.log
          if-no-files-found: warn
          retention-days: 7
