menuentry 'Vincent installer (DESTRUCTIVE - manual disk selection)' {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical netcfg/dhcp_timeout=60 passwd/root-login=true passwd/make-user=false preseed/file=/cdrom/preseed.cfg --- quiet
    initrd /install.amd/initrd.gz
}
