### Vincent Debian 13 appliance installer.
### Disk choice and destructive confirmations are intentionally NOT preseeded.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
### Network interface selection remains interactive. This prevents netcfg from
### silently choosing a remembered/first Wi-Fi network when no wired link is
### available, and allows its standard SSID scan and password prompts to run.
d-i netcfg/get_hostname string vincent-worker
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string America/Sitka
d-i clock-setup/ntp boolean true

### Vincent is an appliance. No human login account or password is created.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean false

### Fail closed immediately if critical preseed answers were not loaded.
d-i preseed/early_command string /bin/sh /cdrom/mission-control/preseed-assert.sh

### Select guided whole-disk LVM automatically, but leave the physical disk
### unselected so the operator must explicitly choose the destructive target.
d-i partman-auto/init_automatically_partition select 60some_device_lvm__________lvm
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string vincent-vg
d-i partman-auto/choose_recipe select atomic
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
### Final destructive write remains interactive.
d-i partman/confirm_write_new_label boolean false
d-i partman/confirm boolean false
d-i partman/confirm_nooverwrite boolean false

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo git curl ca-certificates jq rsync openssh-client python3 python3-venv python3-pip python3-setuptools build-essential xz-utils
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

d-i preseed/late_command string \
    mkdir -p /target/opt/mission-control-media /target/var/log/mission-control; \
    cp /cdrom/mission-control/platform.tar.gz /target/opt/mission-control-media/platform.tar.gz; \
    cp /cdrom/mission-control/expected-commit /target/opt/mission-control-media/expected-commit; \
    cp /cdrom/mission-control/first-boot.sh /target/usr/local/sbin/mission-control-first-boot; \
    cp /cdrom/mission-control/self-test.sh /target/usr/local/sbin/vincent-self-test; \
    cp /cdrom/mission-control/console-status.sh /target/usr/local/sbin/vincent-console-status; \
    cp /cdrom/mission-control/codex-console.sh /target/usr/local/sbin/vincent-codex-console; \
    cp /cdrom/mission-control/mission-control-first-boot.service /target/etc/systemd/system/mission-control-first-boot.service; \
    cp /cdrom/mission-control/vincent-console-status.service /target/etc/systemd/system/vincent-console-status.service; \
    cp /cdrom/mission-control/vincent-codex-console.service /target/etc/systemd/system/vincent-codex-console.service; \
    chmod 0755 /target/usr/local/sbin/mission-control-first-boot /target/usr/local/sbin/vincent-self-test /target/usr/local/sbin/vincent-console-status /target/usr/local/sbin/vincent-codex-console; \
    chmod 0644 /target/opt/mission-control-media/expected-commit; \
    in-target systemctl mask getty@tty1.service getty@tty2.service; \
    in-target systemctl enable mission-control-first-boot.service vincent-console-status.service vincent-codex-console.service

d-i finish-install/reboot_in_progress note
